# Example check: the arm floats in MuJoCo with the J2 spring, from every keyframe of the simulators' model.
# RAFT's public MuJoCo and URDF packages are built and checked in robot_descriptions (raft_description/README.md).
name: check

on:
  push:
  pull_request:

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install mujoco numpy
      - name: Gravity compensation holds every keyframe
        run: python examples/gravity_comp.py --headless --spring 718
