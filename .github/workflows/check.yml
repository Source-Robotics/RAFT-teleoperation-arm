name: check

on:
  push:
  pull_request:

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install mujoco numpy yourdfpy xacro
      - name: URDF, xacro and MJCF agree with the DH table
        run: python tools/check_description.py
      - name: Gravity compensation holds every keyframe
        run: python examples/gravity_comp.py --headless --spring 718
