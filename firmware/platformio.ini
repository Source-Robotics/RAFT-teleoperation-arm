; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ==============================
; Shared settings for all envs
; ==============================
[env]
platform = espressif32@6.12.0          ; pinned: Arduino-ESP32 core 2.0.17 (IDF 4.4); a newer platform changes the core
board = esp32-poe
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter

; ==============================
; Main project (servo control)
; Build/Upload: pio run -e main -t upload
; ==============================
[env:main]
build_src_filter = +<*> -<test_uart/> -<test_ethernet/> -<tools/>
extra_scripts = pre:tools/pio_build_web.py   ; re-embeds web/index.html into src/main/web_assets.h when it changed

; ==============================
; Main project over the network, for the board on PoE without USB (OTA; the firmware switches torque off first,
; so park the arm or hold it). Build/Upload: pio run -e main_ota -t upload
; upload_port: the arm's name or address (reserve it in the router), or pass --upload-port <address>.
; ==============================
[env:main_ota]
extends = env:main
upload_protocol = espota
upload_port = raft-leader.local

; ==============================
; UART test
; Build/Upload: pio run -e test_uart -t upload
; ==============================
[env:test_uart]
build_src_filter = +<*> -<main/> -<test_ethernet/> -<tools/>

; ==============================
; Ethernet test
; Build/Upload: pio run -e test_ethernet -t upload
; ==============================
[env:test_ethernet]
build_src_filter = +<*> -<main/> -<test_uart/> -<tools/>

; ==============================
; Servo ID utility
; Build/Upload: pio run -e set_id -t upload
; ==============================
[env:set_id]
build_src_filter = +<tools/set_id/> +<HLSCL.cpp> +<SCSerial.cpp> +<SCS.cpp> +<SCSCL.cpp> -<main/> -<test_uart/> -<test_ethernet/>